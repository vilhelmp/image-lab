# Image model IDs verified against the Hugging Face inference provider mappings on 2026-09-30.
# Prices are conservative estimates (providers bill per megapixel); check the billing page after
# the first real runs. The edit model is still a placeholder until Phase 4.
image_models:
  fast:
    label: { sv: "Snabb", en: "Fast" }
    description: { sv: "Blixtsnabb och bra till det mesta.", en: "Very fast and good for most ideas." }
    provider: fal
    api_model: "fal-ai/flux/schnell"
    hf_model: "black-forest-labs/FLUX.1-schnell"
    hf_provider: fal-ai
    est_cost_usd: 0.003 # measured 2026-09-30: $0.13 for 44 requests on the HF billing page
    translate_to_english: false
    enabled: true

  quality:
    label: { sv: "Hög kvalitet", en: "High quality" }
    description: { sv: "Långsammare men mer detaljerad.", en: "Slower but more detailed." }
    provider: fal
    api_model: "fal-ai/flux/dev"
    hf_model: "black-forest-labs/FLUX.1-dev"
    hf_provider: fal-ai
    est_cost_usd: 0.04
    enabled: true

  text_expert:
    label: { sv: "Bra på text i bilder", en: "Good at text in images" }
    description: { sv: "Klarar skyltar och bokstäver bättre.", en: "Handles signs and lettering better." }
    provider: fal
    api_model: "fal-ai/qwen-image"
    hf_model: "Qwen/Qwen-Image"
    hf_provider: fal-ai
    est_cost_usd: 0.03
    enabled: true

edit_models:
  default_edit:
    # FLUX.2 klein 4B: Apache-2.0, 3.9 to 5.2 s in the 2026-10-01 bake-off (see todo.md)
    provider: fal
    api_model: "fal-ai/flux-2/klein/4b/distilled/edit"
    hf_model: "black-forest-labs/FLUX.2-klein-4B"
    hf_provider: fal-ai
    est_cost_usd: 0.01 # estimate; check the HF billing page after the first edits
    enabled: true

text_models:
  helper:
    provider: openai
    api_model: "gpt-6-luna" # verified in OpenAI docs 2026-09-30: $0.10 in / $0.50 out per 1M tokens
    reasoning_effort: none # fastest; the policy check and helpers need no reasoning

moderation_model: "omni-moderation-latest" # free; text and image

defaults:
  create_model: fast
  edit_model: default_edit
  compare_a: fast
  compare_b: quality
  text_model: helper
