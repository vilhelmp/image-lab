image_backend: hf # fal | hf. hf remaps every model to its hf_model (needs only HF_TOKEN)

app:
  name: "AI Image Lab"
  default_language: sv
  languages: [sv, en]
  default_theme: system # system | light | dark
  development_mode: false # true = fakes, no keys, no auth. Env DEVELOPMENT_MODE overrides.
  fake_delay_seconds: 1.5 # only used with fakes, to exercise loading states

features:
  compare_tab: true
  help_me: true
  surprise_me: true
  edit_chips: true
  photo_studio: true # the Photo studio tab exists; the admin account switches it on (off at start)
  qr_handoff: false
  show_cost_to_visitors: false
  allow_same_model_compare: false

ui:
  idle_reset_seconds: 180
  history_size: 6
  styles: [photo, illustration, painting, 3d, comic, retro]
  edit_chips: [evening_light, more_playful, new_setting, as_painting, simpler]
  photo_styles: [felt_puppet, rag_doll, clay, animated, comic]
  challenge: { sv: "En svensk stad år 2100", en: "A Swedish city in the year 2100" }
  reset_language_on_new_visitor: true

# Provider-neutral English fragments appended to the visitor's text. Keys match ui.styles.
style_fragments:
  photo: "realistic photograph, natural light, sharp focus"
  illustration: "colorful illustration, clean lines"
  painting: "oil painting, visible brush strokes"
  3d: "3D render, soft lighting, playful"
  comic: "comic book style, bold outlines, bright colors"
  retro: "retro 1970s poster style, warm faded colors"

# One-tap edits under the image. `instruction` is sent to the edit model as it is (English, and the
# subject must stay recognisable); `llm: true` lets the helper LLM pick the specifics each time.
# Keys listed in ui.edit_chips appear, in that order.
edit_chips:
  evening_light:
    label: { sv: "Kvällsljus", en: "Evening light" }
    instruction: "Make it a warm evening scene with golden light. Keep the subject the same."
  more_playful:
    label: { sv: "Mer lekfull", en: "More playful" }
    instruction: "Make it more playful and colorful. Keep the subject the same."
  new_setting:
    label: { sv: "Byt miljö", en: "New setting" }
    llm: true
  as_painting:
    label: { sv: "Som målning", en: "As a painting" }
    instruction: "Turn it into an oil painting. Keep the subject and composition the same."
  simpler:
    label: { sv: "Enklare", en: "Simpler" }
    instruction: "Make it simpler and cleaner, with fewer details and a plain background. Keep the subject the same."

# Photo studio: a visitor's own photo, restyled by the edit model. Instructions are English and
# describe a look, never a brand or a franchise. Keys listed in ui.photo_styles appear, in order.
photo_styles:
  felt_puppet:
    label: { sv: "Filtdocka", en: "Felt puppet" }
    instruction: "Turn each person in this photo into a felt hand puppet version of themselves. Keep each person's face shape, hairstyle, hair colour, expression, pose, clothes and background, so they are still clearly recognisable, but make the skin and clothes look like fuzzy felt fabric with visible stitched seams, and give the eyes a slightly rounder googly puppet look. Give the picture a warm, cheerful, friendly mood: bright soft lighting, lively colours and a relaxed, pleasant look on each face. Nothing dark, gloomy or angry."
  rag_doll:
    label: { sv: "Tygdocka", en: "Rag doll" }
    instruction: "Turn each person in this photo into a stuffed fabric rag doll version of themselves. Keep each person's face shape, hairstyle, hair colour, expression, pose, clothes and background, so they are still clearly recognisable, but make the skin look like soft cloth with visible stitched seams, and give the eyes a button-eye look. Give the picture a warm, cheerful, friendly mood: bright soft lighting, lively colours and a relaxed, pleasant look on each face. Nothing dark, gloomy or angry."
  clay:
    label: { sv: "Lera", en: "Clay" }
    instruction: "Restyle this photo as a plasticine clay model of the same scene. Keep each person's face shape, hairstyle, hair colour, expression, pose, clothes and background, so they are still clearly recognisable, but make the skin, hair, clothes and background look like matte modelling clay with visible fingerprints. Same composition and the same number of people as in the photo. Give the picture a warm, cheerful, friendly mood: bright soft lighting, lively colours and a relaxed, pleasant look on each face. Nothing dark, gloomy or angry."
  animated:
    label: { sv: "Animerad film", en: "Animated movie" }
    instruction: "Redraw this photo as a frame from a polished 3D animated family movie. Keep each person's face shape, hairstyle, hair colour, expression, pose, clothes and background, so they are still clearly recognisable, but with smooth stylised skin, slightly larger eyes, vibrant colours and soft cinematic lighting. Give the picture a warm, cheerful, friendly mood: bright soft lighting, lively colours and a relaxed, pleasant look on each face. Nothing dark, gloomy or angry."
  comic:
    label: { sv: "Serietidning", en: "Comic book" }
    instruction: "Turn this photo into a bold comic-book illustration: thick ink outlines, flat bright colours and halftone shading. Keep the pose and the composition recognisable. Give the picture a warm, cheerful, friendly mood: bright soft lighting, lively colours and a relaxed, pleasant look on each face. Nothing dark, gloomy or angry."

access:
  enabled: true
  expose_api: false # true only while load testing so the Gradio client can call events. Env EXPOSE_API overrides.

safety:
  mode: family
  characters: redirect # allow | redirect | block
  offer_safe_rewrite: true
  fail_closed: true
  max_input_chars: 400

limits:
  max_images: 1000
  max_cost_usd: 40
  max_concurrent_generations: 6
  max_generations_per_minute: 30
  device_cooldown_seconds: 5 # counted from the start of the previous Create
  device_max_images_per_hour: 120 # null = off
