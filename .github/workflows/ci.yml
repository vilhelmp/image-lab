name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: requirements.txt is up to date
        run: |
          uv export --no-hashes --no-dev --no-emit-project --prune gradio > requirements.txt
          git diff --exit-code requirements.txt
      - name: Version pins match README frontmatter
        run: uv run python scripts/check_versions.py
      - name: requirements.txt resolves with the Space's own installs
        run: uv run python scripts/check_space_install.py
