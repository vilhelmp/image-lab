[project]
name = "ai-image-lab"
version = "0.1.0"
description = "Gradio app for a supervised AI image workshop on shared iPads."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "gradio[mcp,oauth]==6.28.0", # must equal sdk_version; HF Spaces installs these extras
    "httpx",
    "huggingface-hub>=1.0",
    "pillow",
    "pydantic>=2",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
